<!DOCTYPE html>
<html lang="en">

<head>
    <title>Daily planner - Timeblocking</title>
    <!-- Mobile friendly meta -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- JQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <!-- Latest compiled and minified CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Latest compiled JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0"></script>
    <link rel="stylesheet" type="text/css" href="./style.css">
    
</head>

<body class="bg-light text-dark">

    <header>
        <img id="img_logo" src="tbp_icon.png" alt="Daily Planner Logo" >
        <h1>Daily Planner</h1>

    </header>

    <main id="main-container" class="container-lg flex-grow-1 my-4" tabindex="-1">

        <!-- Weather container section -->
        <section id="weather-container" class="mt-3 mb-3">

            <small>Weather (temperature)</small>
            <div id="weather_container" class="card shadow-sm border-0 flex-row overflow-x-auto">
                <div class="card-body">
                    <p class="card-text text-muted">Finding weather.....</p>
                </div>
            </div>

            <!-- <canvas id="weather_chart" style="height:100px;width:200px;max-width:200px"></canvas> -->
        </section>

        <!-- Calendar container -->
        <section id="calendar-container" class="mt-3 mb-3 text-bg-secondary p-3">
            <h2 class="h4 mb-3 fw-bold">Today's Schedule</h2>
            <div class="d-flex flex-row justify-content-between mb-3">
                <div id="search_container">
                    <label for="filter_search">Search:</label>
                    <input id="filter_search" maxlength="20">
                </div>
                <div>
                    <button id="clear_calendar" class="btn btn-primary">Clear Calendar</button>
                </div>
            </div>
            <div id="calendar-grid" class="d-flex flex-column gap-2"></div>

            <div class="card shadow-sm border-0">
                <div id="grid_timeblock" class="list-group list-group-flush" role="region"
                    aria-label="15 Minute block intervals.">
                </div>
            </div>
        </section>


        <!--Modal section-->
        <div class="modal fade" id="calendarModal" tabindex="-1" aria-labelledby="calendar-modal-label" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header bg-dark text-white">
                        <h3 id="calendar-modal-label">Edit Calendar Item</h3>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <form id="calendar-form">
                        
                    <div class="modal-body">
                            <input type="hidden" id="modal-time-key" value="">
                            <div class="mb-3">
                                <label for="modal-time-display" class="form-label fw-semibold">Time</label>
                                <input type="text" id="modal-time-display" class="form-control-plaintext fw-bold text-primary fs-5" readonly>
                            </div>
                            <div class="mb-3">
                                <label for="task-input" class="form-label fw-semibold">Description</label>
                                <input type="text" id="task-input" class="form-control" placeholder="Description" maxlength="100" required>
                            </div>
                        
                    </div>
                    <div class="modal-footer">
                        <button id="btn_delete" type="button" data-bs-dismiss="modal" id="btn-delete-task"
                            class="btn btn-outline-danger me-auto">Delete</button>
                        <button id="btn_cancel" type="button" data-bs-dismiss="modal"
                            class="btn btn-secondary me-auto">Cancel</button>
                        <button type="submit" id="btn-save-task" data-bs-dismiss="modal"
                            class="btn btn-primary">Save</button>
                    </div>
                    </form>

    </main>

    <footer class="bg-dark text-white py-3 mt-auto">
        <small>Dashboard Timeblocking</small>
    </footer>

    <script src="./calendar.js"></script>
</body>

</html>
